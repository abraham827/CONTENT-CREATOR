[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "content-creator"
version = "0.1.0"
description = "Generate localized social content ideas with export helpers"
authors = [{ name = "Marketing AI" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "python-docx",
    "python-pptx",
]

[tool.setuptools.packages.find]
where = ["src"]
